participantId: reg-location
displayName: REG-LOCATION - Functional Location Registry
sourceId: REG-LOCATION
sourceOwnerId: ACME-OPERATIONS
logicalId: urn:oiie-sandbox:reg-location
accentColour: "#059669"
releaseMode: Manual
identifierStyle: surrogate

# Consumes engineering output, republishes what a steward approves. Two roles on
# two different channels is the normal shape for a registry: it sits between.
#
# The subscriber leg follows the OIIE naming convention and must match the federation
# id ENG publishes under. The publisher leg has not moved yet -- the operations
# channel is shared with scenarios 2 and 11 and with MMS and CMS, so it converts when
# they do rather than one participant at a time.
channels:
  - channelUri: /acme/8f2f5e1c-6a1e-4c8e-9a5c-2b0e7d3f4a11/engineering/publication
    role: Subscriber
    topics:
      - Segments
    useNotifications: false
  - channelUri: /OIIE-SANDBOX/Enterprise/Site/OandM
    role: Publisher
    topics:
      - Segments
    useNotifications: false

isbm:
  baseUrl: https://acme-api-isbm-dev.azurewebsites.net/api
  tokenSecretName: sandbox-isbm-token-reg-location

cir:
  # The CIR provider's own request channel and topic, taken from its deployed
  # configuration rather than invented here. Both already have a passing round-trip
  # test behind them on the provider side.
  #
  # This channel belongs to the CIR provider: reset ensures it exists but never
  # deletes it, because deleting it would destroy the provider's long-lived
  # provider-request session.
  channelUri: /OIIE/CIR/Request
  requestTopic: ws-CIR
  baseUrl: https://acme-api-cir-dev.azurewebsites.net/api

  # The same registry the engines write to, deliberately.
  #
  # This was OIIE-SANDBOX on a separate CIR deployment, which meant the sandbox
  # and the engines held two registries neither could see. Day zero cleared one
  # of them and reported success, and anything reasoning about "the" registry
  # addressed whichever half it happened to be configured for. Cutting over was
  # free because the legacy registry had issued no CIRIDs.
  registryId: acme
  identityCacheTtl: 00:05:00

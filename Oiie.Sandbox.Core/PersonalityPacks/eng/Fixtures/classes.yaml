# Reference data as ENG holds it.
#
# ENG works to the full library including leaf classes, because engineering is
# where classification originates. REG-LOCATION deliberately holds less - see its
# own fixture file.

propertyDefinitions:
  - key: rdl:RangeMinimum
    name: Range minimum
    dataType: Numeric
    unitOfMeasure: degC
  - key: rdl:RangeMaximum
    name: Range maximum
    dataType: Numeric
    unitOfMeasure: degC
  - key: rdl:ControlAction
    name: Control action
    dataType: Character
  - key: rdl:SafetyIntegrityLevel
    name: Safety integrity level
    dataType: Character

classes:
  - key: rdl:Equipment
    name: Equipment
    appliesTo: Segment
    kind: Taxonomy
    # No properties. Identity and description are CCOM spine fields
    # (IDInInfoSource, ShortName, Description); a class property set that
    # redeclares them would claim Required values that never arrive as
    # properties, because the sender puts them in the spine.
    properties: []

  - key: rdl:Instrument
    name: Instrument
    parent: rdl:Equipment
    appliesTo: Segment
    kind: Taxonomy
    properties:
      - definition: rdl:RangeMinimum
        requirement: Recommended
      - definition: rdl:RangeMaximum
        requirement: Recommended
        minValue: -273
        maxValue: 2000

  - key: rdl:TemperatureIndicatingController
    name: Temperature indicating controller
    parent: rdl:Instrument
    appliesTo: Segment
    kind: Taxonomy
    properties:
      - definition: rdl:ControlAction
        requirement: Required
      # Narrowing: an instrument's range is Recommended and unbounded above 2000,
      # but a temperature controller must have one and cannot exceed 1200.
      - definition: rdl:RangeMaximum
        requirement: Required
        maxValue: 1200

  - key: rdl:SafetyCritical
    name: Safety critical
    appliesTo: Segment
    kind: Aspect
    properties:
      - definition: rdl:SafetyIntegrityLevel
        requirement: Required

# The kinds of design relationship ENG can assert between tags.
#
# Each edge is stored once, in the forward direction, and read from the other end
# through inverseRole - so "BBFQ0032 supplies P-101" and "P-101 is supplied by
# BBFQ0032" are one row, not two that could drift apart.
relationshipTypes:
  - key: eng:Supplies
    forwardRole: Supplies
    inverseRole: Supplied By
    description: The source provides power or medium to the sink.

  # Process flow, which is not the same statement as supply. Two isolation valves in
  # series are both on the same line and neither powers the other, so relating them
  # with eng:Supplies would read as a claim about energy that the design does not make.
  - key: eng:FeedsInto
    forwardRole: Feeds Into
    inverseRole: Fed From
    description: Process medium flows from the source to the sink.

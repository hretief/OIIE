participantId: eng
displayName: ENG - Engineering Design
schema: eng
sourceId: ENG
sourceOwnerId: ACME-ENGINEERING
logicalId: urn:oiie-sandbox:eng
accentColour: "#2563eb"
releaseMode: Manual
identifierStyle: isa-tag

# Publishes only. The self-subscription used for the phase 0 loopback is gone now
# that a real receiver exists.
#
# The URI follows the OIIE naming convention, /{enterprise}/{itwin-federation-id}/
# {domain}/{type}. The federation id is the sandbox's standing iTwin and has to match
# the one in the scenarios byte for byte: this list is what the participant actually
# publishes to, while the scenario's setup.channels only provisions and asserts, so a
# divergence shows up as a run where nothing arrives and nothing says why.
channels:
  - channelUri: /acme/8f2f5e1c-6a1e-4c8e-9a5c-2b0e7d3f4a11/engineering/publication
    role: Publisher
    topics:
      - Segments
    useNotifications: false

  # The enterprise sites channel SyncSites travels on.
  #
  # Declared here even though the ENG *engine* publishes to it rather than this
  # participant, because day zero rebuilds only channels the registry knows
  # about. Left undeclared it was deleted and never recreated, and since nothing
  # self-heals it -- the engine's channel bootstrap creates only the two
  # per-iTwin channels, and the site publisher assumes this one exists -- every
  # SyncSites publication after a reset failed with 404 until someone recreated
  # it by hand.
  #
  # The literal 'enterprise' sits where a federation id sits on every other
  # channel, and that is the point: this message is what brings an iTwin context
  # into being, so it cannot be addressed to one.
  - channelUri: /acme/enterprise/sites/publication
    role: Publisher
    topics:
      - Sites
    useNotifications: false

isbm:
  baseUrl: https://acme-api-isbm-dev.azurewebsites.net/api
  tokenSecretName: sandbox-isbm-token-eng

cir:
  # The CIR provider's own request channel and topic, taken from its deployed
  # configuration rather than invented here. Both already have a passing round-trip
  # test behind them on the provider side.
  #
  # This channel belongs to the CIR provider: reset ensures it exists but never
  # deletes it, because deleting it would destroy the provider's long-lived
  # provider-request session.
  channelUri: /OIIE/CIR/Request
  requestTopic: ws-CIR
  baseUrl: https://acme-api-cir-dev.azurewebsites.net/api
  registryId: acme
  identityCacheTtl: 00:05:00

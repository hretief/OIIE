participantId: mms
displayName: MMS - Maintenance Management
schema: mms
sourceId: MMS
sourceOwnerId: ACME-OPERATIONS
logicalId: urn:oiie-sandbox:mms
accentColour: "#b45309"
releaseMode: Manual
identifierStyle: numeric

# Consumer of engineering provisioning, publisher of maintenance events.
#
# The second role is new. Through phase 1 MMS was the end of the chain — it received
# functional locations and told nobody anything. OIIE Scenario 11 inverts that: when
# a technician installs or removes a serialised asset, MMS is the only system that
# knows, and it becomes the source of record for asset configuration.
#
# The two channels are separate on purpose. /OandM carries engineering structure
# inbound (ISO18435 D0.2 territory); /OandM-Events carries operational events
# outbound (D1.3). Publishing events back onto the channel MMS subscribes to would
# have worked and would have made MMS both publisher and subscriber of one path,
# which is how feedback loops get built by accident.
channels:
  - channelUri: /OIIE-SANDBOX/Enterprise/Site/OandM
    role: Subscriber
    topics:
      - Segments
    useNotifications: false
  - channelUri: /OIIE-SANDBOX/Enterprise/Site/OandM-Events
    role: Publisher
    topics:
      - AssetSegmentEvents
    useNotifications: false

isbm:
  baseUrl: https://isbm-func-44p2f3n6dv7p4.azurewebsites.net/api
  tokenSecretName: sandbox-isbm-token-mms

cir:
  # The CIR provider's own request channel and topic, taken from its deployed
  # configuration rather than invented here. Both already have a passing round-trip
  # test behind them on the provider side.
  #
  # This channel belongs to the CIR provider: reset ensures it exists but never
  # deletes it, because deleting it would destroy the provider's long-lived
  # provider-request session.
  channelUri: /OIIE/CIR/Request
  requestTopic: ws-CIR
  baseUrl: https://cir-func-44p2f3n6.azurewebsites.net/api
  registryId: OIIE-SANDBOX
  identityCacheTtl: 00:05:00

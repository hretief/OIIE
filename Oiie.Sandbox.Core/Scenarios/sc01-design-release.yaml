# Scenario 1 - publish engineering design data from ENG to REG-LOCATION.
#
# OpenO&M use case: UC01 (engineering handover). The use case describes the whole
# journey from design to operations; scenario 1 is only its first leg, and stopping
# here is the point.
#
# ENG releases a named version and the tag travels to REG-LOCATION, where it lands in
# the stewardship queue as a proposal. It goes no further. Design data at this stage
# is a proposal about a plant that may not be built as drawn, and pushing it into MMS
# would put speculative rows into the system of record that maintenance planners work
# from. REG-LOCATION is the release gate: a steward's approval, not an engineer's
# publish, is what admits a tag to operations. That approval is scenario 2.
#
# So the closing assertions here are negative ones. They are the whole reason the
# scenario is separate: a run that quietly delivered to MMS would still satisfy every
# positive assertion above, and only 'nothing reached MMS' can detect the gate
# leaking.
#
# Relationships travel on this leg too, not on a later one. An edge is design data in
# exactly the same sense as the tags it joins: engineering asserts that the supply
# feeds the pump at the moment it draws them that way, and holding the edge back until
# something downstream needs it would mean the registry's copy of the design was
# missing a part of the design. The registry retains an edge whose endpoints are still
# proposals, unresolved, and resolves it when they are approved -- so an edge arriving
# before its endpoints clear the gate is normal here rather than an error.
#
# Identifiers only appear where this file chooses them. TIC-106, P-101 and BBFQ0032
# are authored here; LOC-nnnnnn is assigned by REG-LOCATION, so assertions select on
# provenance columns rather than on values that cannot be known before the run.
id: sc01-design-release
name: Design release to the location registry
scenario: 1
useCase: UC01

participants:
  - eng
  - reg-location
  # Declared only so the gate can be tested against it. Nothing in this scenario
  # asks MMS to do anything -- it is here to be shown to have received nothing.
  - mms

setup:
  # Reset first: a stewardship queue left over from a previous run would let scenario 2
  # approve something this run never authored.
  reset: true
  channels:
    - uri: /OIIE-SANDBOX/Enterprise/Site/Eng
      type: Publication
      subscribers:
        - reg-location
    # Declared even though nothing should arrive on it. The 'no message reached MMS'
    # assertion below can only be trusted if MMS was genuinely subscribed and listening
    # -- otherwise it passes because nobody was home, which is not the same as the gate
    # holding.
    - uri: /OIIE-SANDBOX/Enterprise/Site/OandM
      type: Publication
      subscribers:
        - mms

steps:
  # -- ENG authors and releases -----------------------------------------------
  - id: author-tag
    at: eng
    action: create_tag
    args:
      tagNumber: TIC-106
      serviceDescription: Top temperature control
      unitNumber: "101"
      classKey: rdl:TemperatureIndicatingController
      rangeMinimum: 0
      rangeMaximum: 250
      controlAction: Reverse

  - at: eng
    assert: store_contains
    entity: Tag
    where: "TagNumber = 'TIC-106'"

  # The pump and its power supply. These are authored here rather than in the
  # scenario that eventually installs an asset against the pump: scenario 11 is a
  # maintenance process and has no business creating engineering design data. It
  # depends on the pump existing in MMS, and this is the leg where that begins.
  - id: author-pump
    at: eng
    action: create_tag
    args:
      tagNumber: P-101
      serviceDescription: Feed pump
      unitNumber: "101"
      classKey: rdl:Instrument
      controlAction: Reverse

  # Both ends must exist before the edge can be asserted, so the supply is authored
  # before the relationship that names it.
  - id: author-supply
    at: eng
    action: create_tag
    args:
      tagNumber: BBFQ0032
      serviceDescription: Feed pump power supply
      unitNumber: "101"
      classKey: rdl:Equipment

  # The pump does not stand alone: it is fed by the supply, and that is part of the
  # design rather than a note attached to it. Direction is explicit -- the supplier
  # is the source -- and the reverse reading comes from the type, not from a second
  # edge pointing the other way.
  - id: relate-supply
    at: eng
    action: relate_tags
    args:
      from: BBFQ0032
      to: P-101
      type: eng:Supplies

  # The trigger for this scenario: promoting a named version is the engineering act
  # that says a design is ready to be seen outside ENG.
  - id: release
    at: eng
    action: promote_named_version
    args:
      name: sc01 design release

  # Posted, not merely queued. The two are indistinguishable from the receiver's
  # side and have entirely different owners.
  - at: eng
    assert: outbox_state
    state: Posted
    verb: Sync
    noun: Segments
    within: 60s

  # -- REG-LOCATION receives and holds ------------------------------------------
  - at: reg-location
    assert: message_received
    channel: /OIIE-SANDBOX/Enterprise/Site/Eng
    verb: Sync
    noun: Segments
    within: 60s

  - at: reg-location
    assert: bod_valid

  # Arrival is not acceptance. This is the gate itself: the tag is now a proposal
  # awaiting a steward, and 'Proposed' is what distinguishes held from released.
  #
  # State is stored as a string, not the enum's ordinal, so 'Proposed' is the
  # comparison that actually matches a queued row.
  - at: reg-location
    assert: store_contains
    entity: StewardshipItem
    where: "SourceIdentifier = 'TIC-106' AND State = 'Proposed'"
    within: 30s

  - at: reg-location
    assert: store_contains
    entity: StewardshipItem
    where: "SourceIdentifier = 'P-101' AND State = 'Proposed'"
    within: 30s

  # No Location row yet. Approval is what creates one, and approval has not happened,
  # so a Location here would mean the queue was bypassed.
  - at: reg-location
    assert: store_not_contains
    entity: Location
    where: "SourceIdentifier = 'TIC-106'"

  # -- The relationship follows the tags ------------------------------------------
  # Published after the segments so the registry has already seen both endpoints as
  # proposals. It is not gated on approval: the registry retains the edge naming the
  # sender's identifiers and resolves it to its own codes when the gate opens.
  - id: publish-relationships
    at: eng
    action: publish_relationships

  - at: reg-location
    assert: message_received
    channel: /OIIE-SANDBOX/Enterprise/Site/Eng
    verb: Sync
    noun: SegmentMeshConnections
    within: 60s

  - at: reg-location
    assert: bod_valid

  # Retained, and retained unresolved. The edge is held against the identifiers ENG
  # used, because the registry has no codes of its own to state it with until the
  # proposals are approved. IsResolved = 0 is the assertion that distinguishes
  # 'waiting for the gate' from 'silently discarded', which is what the earlier
  # reject-on-arrival behaviour did.
  - at: reg-location
    assert: store_contains
    entity: LocationConnection
    where: "TypeKey = 'eng:Supplies' AND FromSourceIdentifier = 'BBFQ0032' AND ToSourceIdentifier = 'P-101' AND IsResolved = 0"
    within: 60s

  # No codes yet, for the same reason there is no Location yet.
  - at: reg-location
    assert: store_not_contains
    entity: LocationConnection
    where: "FromLocationCode IS NOT NULL OR ToLocationCode IS NOT NULL"

  # -- The gate holds -----------------------------------------------------------
  # Nothing reached MMS. This is the assertion the scenario exists for: early design
  # data stopping at the registry rather than flowing through to operations.
  #
  # Asserted at MMS rather than on REG-LOCATION's outbox because the outbox assertion
  # answers "did at least N items reach this state" and cannot express absence. The
  # receiving end can, and it is also the stronger claim: it holds regardless of how
  # the publication was or was not attempted.
  - at: mms
    assert: message_not_received
    channel: /OIIE-SANDBOX/Enterprise/Site/OandM
    verb: Sync
    noun: Segments

  # The gate holds for relationships on the same terms as for segments. Without this,
  # the edge could reach operations while the locations it names did not, leaving MMS
  # holding a relationship between two things it has never heard of.
  - at: mms
    assert: message_not_received
    channel: /OIIE-SANDBOX/Enterprise/Site/OandM
    verb: Sync
    noun: SegmentMeshConnections

  - at: mms
    assert: store_not_contains
    entity: FunctionalLocationRecord
    where: "ForeignSourceId = 'REG-LOCATION'"

  - at: mms
    assert: store_not_contains
    entity: LocationRelationshipRecord
    where: "TypeKey = 'eng:Supplies'"

  # -- CIR registration ---------------------------------------------------------
  # Both participants that hold the identity register it. MMS is absent because MMS
  # has nothing to register yet -- it has never seen this tag.
  - id: register-eng
    at: eng
    action: register_cir

  # Written under args because a bare 'id' at item level names the step, not the
  # identifier being looked up.
  - at: eng
    assert: cir_registered
    within: 60s
    args:
      id: TIC-106

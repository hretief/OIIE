# Scenario 2 - publish approved location data from REG-LOCATION to O&M.
#
# OpenO&M use case: UC01 (engineering handover), second leg.
#
# Scenario 1 left a tag sitting in REG-LOCATION's stewardship queue, and an edge
# retained beside it that could not yet be stated in the registry's own vocabulary.
# This scenario starts where that one stopped, with the act that scenario 1
# deliberately withheld: a steward approves the proposal. That approval is the trigger
# here, and it is a different kind of event from the one that triggered scenario 1 --
# an engineer promoting a named version is a statement about design maturity, whereas
# approval is a release decision about what operations is allowed to see.
#
# Approval does two things, and both are asserted below. It mints location codes, and
# by doing so it makes the retained edge expressible: an edge that arrived naming ENG
# tag numbers can now be restated between LOC- codes and sent onward. That is why the
# relationship reaches operations here and not in scenario 1.
#
# Splitting the two is what makes the gate real. If one file carried the whole flow,
# 'design data reached MMS' and 'approved data reached MMS' would be the same passing
# run, and the sandbox could not tell a working gate from an absent one.
#
# This scenario does not reset. It consumes what scenario 1 produced, so a reset here
# would destroy the very queue it needs -- which is why sc01 is declared as a
# prerequisite rather than left as an unwritten convention.
id: sc02-operations-release
name: Approved release to operations
scenario: 2
useCase: UC01
requires:
  - sc01-design-release

participants:
  - eng
  - reg-location
  - mms

setup:
  # Deliberately no reset. See the header: the stewardship queue this scenario
  # approves is scenario 1's output.
  reset: false
  channels:
    - uri: /OIIE-SANDBOX/Enterprise/Site/OandM
      type: Publication
      subscribers:
        - mms

steps:
  # -- The precondition scenario 1 leaves behind ---------------------------------
  # Checked first and without a wait. If scenario 1 has not run, this fails
  # immediately and says so, rather than letting the approval step below report
  # 'approved 0 items' and leaving the reader to work out why a scenario that
  # apparently succeeded delivered nothing.
  - at: reg-location
    assert: store_contains
    entity: StewardshipItem
    where: "SourceIdentifier = 'TIC-106' AND State = 'Proposed'"

  # The retained edge is the second half of what scenario 1 leaves behind, and the
  # part this scenario is here to resolve.
  - at: reg-location
    assert: store_contains
    entity: LocationConnection
    where: "TypeKey = 'eng:Supplies' AND IsResolved = 0"

  # -- The steward releases ------------------------------------------------------
  # The trigger for this scenario.
  - id: approve
    at: reg-location
    action: approve_stewardship
    args:
      decidedBy: sc02

  # The registry assigns its own key and keeps the origin. Selecting on
  # SourceIdentifier rather than LocationCode is what makes that testable without
  # knowing the surrogate in advance.
  - at: reg-location
    assert: store_contains
    entity: Location
    where: "SourceIdentifier = 'TIC-106' AND LocationCode <> 'TIC-106'"
    within: 30s

  - at: reg-location
    assert: outbox_state
    state: Posted
    verb: Sync
    noun: Segments
    within: 60s

  # Approval resolved the retained edge. Endpoints are now the registry's own codes,
  # both readings survived, and the two ends are distinct -- an edge that resolved
  # both ends to the same code would mean the endpoint lookup collapsed rather than
  # matched.
  - at: reg-location
    assert: store_contains
    entity: LocationConnection
    where: "TypeKey = 'eng:Supplies' AND IsResolved = 1 AND ForwardRole = 'Supplies' AND InverseRole = 'Supplied By' AND FromLocationCode LIKE 'LOC-%' AND ToLocationCode LIKE 'LOC-%' AND FromLocationCode <> ToLocationCode"
    within: 60s

  - at: reg-location
    assert: outbox_state
    state: Posted
    verb: Sync
    noun: SegmentMeshConnections
    within: 60s

  # -- MMS consumes ---------------------------------------------------------------
  - at: mms
    assert: message_received
    channel: /OIIE-SANDBOX/Enterprise/Site/OandM
    verb: Sync
    noun: Segments
    within: 60s

  - at: mms
    assert: bod_valid

  # MMS holds a third identifier and, at this point, no idea that it names the same
  # thing as the other two.
  #
  # The wait matters: this row arrives over the bus, so evaluating it instantly races
  # delivery.
  #
  # This no longer asserts "and unresolved". The real schema has no Cirid column to be
  # null, so unresolvedness is not a property of the row any more -- it is the absence
  # of a registry assertion, which the cir_registered step below is what actually
  # tests. Status 3 is 'Proposed', which is what MMS records for something received
  # but not yet surveyed.
  - at: mms
    assert: store_contains
    entity: LightSystemInventory
    where: "LIGHT_SYSTEM_STATUS_ID = 3"
    within: 60s

  # -- The topology arrives with the locations --------------------------------------
  # Ordered after the segments deliberately: the edge names locations, and a planner
  # reading it needs those locations to be there. MMS stores it either way, but this
  # scenario asserts the case where the handover is coherent.
  - at: mms
    assert: message_received
    channel: /OIIE-SANDBOX/Enterprise/Site/OandM
    verb: Sync
    noun: SegmentMeshConnections
    within: 60s

  # MMS holds the edge in the registry's vocabulary, not its own. It originated
  # neither end and has no standing to restate the relationship, so LOC- codes are
  # what it stores. Joining those codes back to a light system now requires ws-CIR:
  # the real schema has no foreign-identifier column to match them against.
  - at: mms
    assert: store_contains
    entity: LocationRelationshipRecord
    where: "TypeKey = 'eng:Supplies' AND ForwardRole = 'Supplies' AND InverseRole = 'Supplied By' AND FromLocationId LIKE 'LOC-%' AND ToLocationId LIKE 'LOC-%'"
    within: 60s

  # The pump specifically. Scenario 11 raises work orders against it, and asserting
  # only 'some location arrived' would let that scenario fail later with a much less
  # informative message.
  #
  # Matched on LIGHT_SYSTEM_NAME because that is the alternate key and the only local
  # handle on the row: the sender's own identifier is not stored anywhere in MMS.
  - at: mms
    assert: store_contains
    entity: LightSystemInventory
    where: "LIGHT_SYSTEM_NAME = 'P-101'"
    within: 60s

  # -- CIR registration and resolution --------------------------------------------
  - id: register-reg-location
    at: reg-location
    action: register_cir

  - id: register-mms
    at: mms
    action: register_cir

  # The handover has only succeeded once MMS can turn an identifier it never issued
  # into the shared identity. Asked from MMS's point of view, because that is how a
  # participant actually asks: it holds a foreign identifier and wants to know what it
  # names.
  #
  # This asserts the registry rather than a local column, and now necessarily so:
  # LIGHT_SYSTEM_INVENTORY has no Cirid column to write back to, so the registry is
  # the only place the resolution exists.
  - at: mms
    assert: cir_registered
    within: 60s
    args:
      source: eng
      id: TIC-106

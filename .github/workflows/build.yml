name: build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows because EngProvider.E2E.Tests drives a real database through
    # '(localdb)\MSSQLLocalDB', and LocalDB is Windows-only -- on ubuntu all
    # fourteen of its tests fail with PlatformNotSupportedException.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The instance exists on the image but is not guaranteed to be running,
      # and a stopped instance fails the same way a missing one does.
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          SqlLocalDB info
          SqlLocalDB start MSSQLLocalDB
          SqlLocalDB info MSSQLLocalDB

      - name: Restore
        run: dotnet restore OpenOM.slnx

      - name: Build
        run: dotnet build OpenOM.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OpenOM.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

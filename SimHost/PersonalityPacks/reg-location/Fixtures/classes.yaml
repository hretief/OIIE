# Reference data as REG-LOCATION holds it.
#
# Deliberately one level short of ENG: no rdl:TemperatureIndicatingController.
#
# That asymmetry is the fixture's whole purpose. When ENG sends a tag classified
# against the leaf, REG-LOCATION binds at rdl:Instrument instead and flags the
# result degraded - partial understanding rather than rejection. A library that
# every participant held completely would make graceful degradation untestable,
# and it is the behaviour that argues for governed reference data in the first
# place.
#
# Note what the registry does hold: the property definitions themselves. Missing
# a class is not the same as missing everything the class refers to, so an
# incoming control action is understood and stored as mapped data even though
# the class requiring it could not be resolved. MMS, holding no fixtures at all,
# retains the same value unmapped -- which is the contrast the demo turns on.

propertyDefinitions:
  - key: rdl:RangeMinimum
    name: Range minimum
    dataType: Numeric
    unitOfMeasure: degC
  - key: rdl:RangeMaximum
    name: Range maximum
    dataType: Numeric
    unitOfMeasure: degC
  # Held even though the leaf class that requires it is not.
  #
  # Holding a definition and holding the class that sanctions it are separate
  # questions, and conflating them is what makes federation look all-or-nothing.
  # The registry cannot resolve rdl:TemperatureIndicatingController, so it binds
  # a temperature controller at rdl:Instrument and records the result degraded --
  # but it still understands what a control action is, so the value arrives
  # mapped rather than merely retained.
  #
  # MMS holds no reference data at all, so the same value lands there unmapped.
  # One value, three participants, three different degrees of understanding: that
  # is the asymmetry these fixtures exist to produce.
  - key: rdl:ControlAction
    name: Control action
    dataType: Character

classes:
  - key: rdl:Equipment
    name: Equipment
    appliesTo: Segment
    kind: Taxonomy
    # No properties. Identity and description are CCOM spine fields
    # (IDInInfoSource, ShortName, Description); a class property set that
    # redeclares them would claim Required values that never arrive as
    # properties, because the sender puts them in the spine.
    properties: []

  - key: rdl:Instrument
    name: Instrument
    parent: rdl:Equipment
    appliesTo: Segment
    kind: Taxonomy
    properties:
      - definition: rdl:RangeMinimum
        requirement: Recommended
      - definition: rdl:RangeMaximum
        requirement: Recommended
        minValue: -273
        maxValue: 2000
      # Attached at Instrument rather than at the leaf, because that is the most
      # specific class the registry actually holds. ENG requires it only of a
      # temperature controller; the registry cannot express that distinction and
      # asks for it more broadly instead -- a coarser but honest reading of the
      # same reference data, which is what binding to an ancestor means.
      - definition: rdl:ControlAction
        requirement: Recommended
